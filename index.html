<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>
  <style>
    /* Itt állítható a középső tartalmi rész "zoom"-ja.
       Pl. 90% = kisebb, 110% = nagyobb. A bal oldali sáv változatlan marad. */
    :root {
      --content-zoom: 85%;
      /* Bejegyzések közötti vastag elválasztó vonal ki/be kapcsolása: 1 = látszik, 0 = nincs vonal */
      --show-post-separator: 0;
    }

    .markdown-body {
      text-size-adjust: 100%;
      margin: 0;
      color: #1f2328;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: var(--content-zoom);
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px;
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .sidebar {
      flex: 0 0 260px;
      width: 260px;
      position: sticky;
      top: 32px;
    }

    .sidebar h2 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0 0 12px;
      font-size: 16px;
      color: #656d76;
    }

    .sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border-left: 2px solid #d0d7de;
    }

    .sidebar li {
      margin: 0;
    }

    .sidebar a {
      display: block;
      padding: 8px 12px;
      color: #0969da;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    .sidebar a:hover {
      background-color: #f6f8fa;
      text-decoration: none;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .content section {
      margin-bottom: 64px;
      padding-top: 8px;
      padding-left: 1.5rem;
    }

    .content section + section {
      margin-top: 16px;
      padding-top: 48px;
      border-top: calc(var(--show-post-separator) * 3px) solid #d0d7de;
    }

    .content section > h1 {
      margin-left: -1.5rem;
    }

    .markdown-body a {
      background-color: transparent;
      color: #0969da;
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body b,
    .markdown-body strong {
      font-weight: 400;
      font-style: italic;
    }

    .markdown-body h1 strong,
    .markdown-body h1 b,
    .markdown-body h2 strong,
    .markdown-body h2 b,
    .markdown-body h3 strong,
    .markdown-body h3 b,
    .markdown-body h4 strong,
    .markdown-body h4 b,
    .markdown-body h5 strong,
    .markdown-body h5 b,
    .markdown-body h6 strong,
    .markdown-body h6 b {
      font-weight: inherit;
      font-style: normal;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 24px;
      margin-bottom: 16px;
      font-weight: 600;
      line-height: 1.25;
    }

    .markdown-body h1 {
      padding-bottom: 0.3em;
      font-size: 2.7em;
      font-weight: 700;
      margin: 24px 0 16px;
    }

    .markdown-body h2 {
      padding-bottom: 0.3em;
      font-size: 1.3em;
      font-weight: 500;
      border-bottom: 1px solid #d8dee4;
    }

    .markdown-body h3 {
      font-size: 1.25em;
    }

    .markdown-body h4 {
      font-size: 1em;
    }

    .markdown-body h5 {
      font-size: 0.875em;
    }

    .markdown-body h6 {
      font-size: 0.85em;
      color: #656d76;
    }

    .markdown-body p {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 2em;
    }

    .markdown-body ol ol,
    .markdown-body ul ol {
      list-style-type: lower-roman;
    }

    .markdown-body ol ol ol,
    .markdown-body ol ul ol,
    .markdown-body ul ol ol,
    .markdown-body ul ul ol {
      list-style-type: lower-alpha;
    }

    .markdown-body ol ol,
    .markdown-body ol ul,
    .markdown-body ul ol,
    .markdown-body ul ul {
      margin-top: 0;
      margin-bottom: 0;
    }

    .markdown-body li > p {
      margin-top: 16px;
    }

    .markdown-body li + li {
      margin-top: 0.25em;
    }

    .markdown-body blockquote {
      padding: 0 1em;
      color: #656d76;
      border-left: 0.25em solid #d0d7de;
      margin: 0 0 16px;
    }

    .markdown-body blockquote > :first-child {
      margin-top: 0;
    }

    .markdown-body blockquote > :last-child {
      margin-bottom: 0;
    }

    .markdown-body code,
    .markdown-body pre,
    .markdown-body samp {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    .markdown-body code {
      padding: 0.2em 0.4em;
      margin: 0;
      font-size: 85%;
      white-space: break-spaces;
      background-color: rgba(175, 184, 193, 0.2);
      border-radius: 6px;
    }

    .markdown-body pre {
      padding: 16px;
      overflow: auto;
      font-size: 85%;
      line-height: 1.45;
      background-color: #f6f8fa;
      border-radius: 6px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body pre code {
      display: inline;
      padding: 0;
      margin: 0;
      overflow: visible;
      line-height: inherit;
      overflow-wrap: normal;
      background-color: transparent;
      border: 0;
      font-size: 100%;
    }

    .markdown-body > :first-child {
      margin-top: 0 !important;
    }

    .markdown-body > :last-child {
      margin-bottom: 0 !important;
    }

    .error {
      color: #d1242f;
      text-align: center;
      padding: 48px 24px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (max-width: 768px) {
      .page {
        flex-direction: column;
      }

      .sidebar {
        flex: none;
        width: 100%;
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h2>Bejegyzések</h2>
      <nav>
        <ul id="toc"></ul>
      </nav>
    </aside>
    <main class="content">
      <div id="content" class="markdown-body">
        <p>Betöltés&hellip;</p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    function slugFromFilename(filename) {
      return filename.replace(/\.md$/i, '');
    }

    async function loadPosts() {
      const el = document.getElementById('content');
      const toc = document.getElementById('toc');

      try {
        const res = await fetch('posts.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const filenames = await res.json();

        const sorted = filenames.slice().sort().reverse();
        if (sorted.length === 0) {
          el.innerHTML = '<div class="error">Nincsenek bejegyzések.</div>';
          return;
        }

        const texts = await Promise.all(
          sorted.map(async (filename) => {
            const r = await fetch('posts/' + filename);
            if (!r.ok) throw new Error('HTTP ' + r.status + ' (' + filename + ')');
            return { filename, md: await r.text() };
          })
        );

        marked.setOptions({ gfm: true, breaks: false });

        let html = '';
        const links = [];

        for (const { filename, md } of texts) {
          const id = slugFromFilename(filename);
          const body = marked.parse(md);

          const temp = document.createElement('div');
          temp.innerHTML = body;
          const firstHeading = temp.querySelector('h1');
          const label = firstHeading
            ? firstHeading.textContent.trim()
            : id;

          html += '<section id="post-' + id + '">' + body + '</section>\n';
          links.push({ id, label });
        }

        el.innerHTML = html;

        toc.innerHTML = links.map(({ id, label }) =>
          '<li><a href="#post-' + id + '">' + escapeHtml(label) + '</a></li>'
        ).join('');

        const firstLabel = links[0].label;
        if (firstLabel) {
          document.title = firstLabel;
        }
      } catch (err) {
        el.innerHTML = '<div class="error">Nem sikerült betölteni a bejegyzéseket.</div>';
        console.error('Failed to load posts:', err);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadPosts();
  </script>
</body>
</html>
